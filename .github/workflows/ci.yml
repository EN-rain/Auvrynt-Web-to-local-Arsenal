name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20.12"
          - node: "22"
          - node: "26"

    env:
      AUVRYNT_ALLOWED_ROOTS: ${{ github.workspace }}
      AUVRYNT_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      AUVRYNT_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene
        run: npm run hygiene

      - name: Static checks
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor
